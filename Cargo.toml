[package]
name = "microphone-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
cpal = "0.18"
eframe = "0.37"
hound = "3.5"
midir = "0.11"
opus = "0.4"
rtrb = "0.4"
rustysynth = "1.3"
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = "0.25"
tray-icon = "0.26"
windows = { version = "0.62", features = ["Media_SpeechSynthesis", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_System_Com", "Media_Core"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }

# Синтезатор пианино считает звук в реальном времени — даже в отладочной
# сборке он должен быть оптимизирован, иначе не успевает и звук рвётся.
[profile.dev.package.rustysynth]
opt-level = 3
