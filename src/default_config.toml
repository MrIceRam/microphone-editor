# ============================================================
#  Microphone Editor — настройки
#  Этот файл можно править вручную (Блокнотом). Программа сама
#  сохраняет сюда изменения из окна и не трогает комментарии.
#  Если сломаешь файл — программа переименует его в
#  config.broken.toml и создаст новый с настройками по умолчанию.
# ============================================================

[audio]
# Твой микрофон: часть названия устройства (без учёта регистра).
# Пусто = микрофон, выбранный в Windows по умолчанию.
input_device = ""

# Куда отправлять обработанный голос — выход виртуального микрофона.
# Пусто = найти автоматически (VB-Audio Virtual Cable или Steam Streaming
# Microphone). В Discord и играх выбирается парный микрофон кабеля.
output_device = ""

# На сколько дБ виртуальный кабель сам усиливает звук. Измеряется кнопкой
# «Проверить»; программа заранее ослабляет звук на столько же.
cable_gain_db = 0.0
# Для какого выхода измерено cable_gain_db (при смене кабеля мерится заново).
cable_gain_device = ""

# Усиление микрофона в децибелах (0 = без изменений, 6 = вдвое громче).
input_gain_db = 0.0

# Слышать себя в наушниках (вместе с эффектом лага).
monitor = false
# Наушники/колонки для прослушки. Пусто = устройство Windows по умолчанию.
monitor_device = ""
# Громкость прослушки, 0..100.
monitor_volume = 80

# Запас буфера на выходе в миллисекундах. Меньше = меньше задержка,
# но если звук начнёт трещать — увеличь (например до 40–60).
buffer_ms = 30

[lag]
# Режим лага:
#   "mix"      — плохой интернет: робот + скачки пинга + заедания вперемешку
#   "robot"    — потеря пакетов: металлический «роботный» голос
#   "dropouts" — голос пропадает кусками
#   "spikes"   — скачки пинга: голос замирает, потом догоняет
#   "stutter"  — заедание: «п-п-п-привет»
mode = "mix"

# Сила эффекта, 0..100.
intensity = 60

# Что делать, когда пинг «отпустило» после скачка:
#   "speedup" — проиграть пропущенное ускоренно (как в Discord)
#   "skip"    — выкинуть пропущенное и продолжить с текущего момента
catchup = "speedup"
# Во сколько раз ускорять при догоне (1.2 .. 3.0).
catchup_speed = 1.6

# Битрейт кодека Opus в бит/с. В Discord по умолчанию 64000.
# Чем ниже, тем «хуже связь» звучит даже без потерь (например 12000).
bitrate = 64000

[hotkey]
# Клавиша лага. Примеры: "F8", "X", "CapsLock", "Mouse4", "Mouse5",
# "Numpad0", "LAlt", "Tilde". Пусто = без горячей клавиши.
key = "F8"

# "hold"   — лагает, пока держишь клавишу
# "toggle" — нажал = включил, нажал ещё раз = выключил
mode = "hold"

[ui]
# Какая вкладка открыта при запуске: "lag", "piano", "keys", "devices".
tab = "lag"

[piano]
# Звук пианино (MIDI-клавиатуры или экранного пианино) в микрофон.
enabled = true

# Файл SoundFont (.sf2) из папки soundfonts. Пусто = первый найденный.
soundfont = ""

# Инструмент — номер программы General MIDI: 0 = рояль, 4 = электропиано,
# 19 = церковный орган, 24 = гитара, 40 = скрипка, 80 = синтезатор...
instrument = 0

# Громкость пианино, 0..100.
volume = 70

# Слышать пианино в наушниках (даже если «слышать себя» выключено).
monitor = true

# Пианино лагает вместе с голосом, когда включён лаг.
through_lag = false

# Сдвиг высоты в полутонах (-24..24). 12 = на октаву выше.
transpose = 0

[midi]
# MIDI-клавиатура: часть названия. Пусто = первая найденная.
device = ""

# Нажимать клавиши клавиатуры по нотам (для игр). Пока выключено —
# пианино только звучит и ничего не нажимает.
send_keys = false

# Клавиша для правой педали. Пусто = педаль только для звука.
# Например "LShift" — в Dota это очередь приказов.
pedal_key = ""

# Привязки «нота = клавиша». C4 — средняя «до», C#4 — до-диез.
# Клавиши пишутся как у горячей клавиши: "Q", "F1", "Space", "Mouse2" (ПКМ).
# Удобнее назначать из окна программы кнопкой «Добавить привязку».
[keymap]
