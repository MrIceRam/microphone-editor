# ============================================================
#  Microphone Editor — настройки
#  Этот файл можно править вручную (Блокнотом). Программа сама
#  сохраняет сюда изменения из окна и не трогает комментарии.
#  Если сломаешь файл — программа переименует его в
#  config.broken.toml и создаст новый с настройками по умолчанию.
# ============================================================

[audio]
# Твой микрофон: часть названия устройства (без учёта регистра).
# Пусто = микрофон, выбранный в Windows по умолчанию.
input_device = ""

# Куда отправлять обработанный голос. Это должен быть виртуальный
# кабель VB-Audio: "CABLE Input". В Discord как микрофон выбирается
# парное устройство "CABLE Output".
output_device = "CABLE Input"

# Усиление микрофона в децибелах (0 = без изменений, 6 = вдвое громче).
input_gain_db = 0.0

# Слышать себя в наушниках (вместе с эффектом лага).
monitor = false
# Наушники/колонки для прослушки. Пусто = устройство Windows по умолчанию.
monitor_device = ""
# Громкость прослушки, 0..100.
monitor_volume = 80

# Запас буфера на выходе в миллисекундах. Меньше = меньше задержка,
# но если звук начнёт трещать — увеличь (например до 40–60).
buffer_ms = 30

[lag]
# Режим лага:
#   "mix"      — плохой интернет: робот + скачки пинга + заедания вперемешку
#   "robot"    — потеря пакетов: металлический «роботный» голос
#   "dropouts" — голос пропадает кусками
#   "spikes"   — скачки пинга: голос замирает, потом догоняет
#   "stutter"  — заедание: «п-п-п-привет»
mode = "mix"

# Сила эффекта, 0..100.
intensity = 60

# Что делать, когда пинг «отпустило» после скачка:
#   "speedup" — проиграть пропущенное ускоренно (как в Discord)
#   "skip"    — выкинуть пропущенное и продолжить с текущего момента
catchup = "speedup"
# Во сколько раз ускорять при догоне (1.2 .. 3.0).
catchup_speed = 1.6

# Битрейт кодека Opus в бит/с. В Discord по умолчанию 64000.
# Чем ниже, тем «хуже связь» звучит даже без потерь (например 12000).
bitrate = 64000

[hotkey]
# Клавиша лага. Примеры: "F8", "X", "CapsLock", "Mouse4", "Mouse5",
# "Numpad0", "LAlt", "Tilde". Пусто = без горячей клавиши.
key = "F8"

# "hold"   — лагает, пока держишь клавишу
# "toggle" — нажал = включил, нажал ещё раз = выключил
mode = "hold"
